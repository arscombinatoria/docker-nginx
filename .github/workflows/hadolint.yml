name: Hadolint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.0.0
        with:
          fetch-depth: 0

      - name: Run hadolint
        uses: reviewdog/action-hadolint@4d2cf3a12417a52584e2e251e5cc2ba97823cbdd # v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Post lint findings as PR review comments so they show up on the diff and in the timeline.
          reporter: github-pr-review
          level: warning
          filter_mode: nofilter
          # Keep the workflow green while surfacing warnings via review comments.
          fail_level: none
          reviewdog_flags: -tee
