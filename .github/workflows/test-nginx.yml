name: Test nginx build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          tags: nginx-brotli:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start nginx container
        run: |
          docker run -d --name nginx-ci -p 8080:80 nginx-brotli:ci

      - name: Wait for nginx to become ready
        shell: bash
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:8080 >nginx-index.html; then
              exit 0
            fi
            sleep 3
          done
          echo "nginx did not become ready" >&2
          exit 1

      - name: Validate nginx configuration and Brotli modules
        run: |
          docker exec nginx-ci nginx -t
          docker exec nginx-ci test -f /etc/nginx/modules/ngx_http_brotli_filter_module.so
          docker exec nginx-ci test -f /etc/nginx/modules/ngx_http_brotli_static_module.so
          test -s nginx-index.html

      - name: Cleanup
        if: always()
        run: docker rm -f nginx-ci
